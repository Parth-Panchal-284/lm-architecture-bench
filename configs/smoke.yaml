# Tiny end-to-end run for validating the installation and GPU path.
defaults: [char_transformer_modern.yaml]
name: smoke
run_dir: outputs/nanolm/smoke

model:
  dim: 64
  n_layers: 2
  n_heads: 2
  dropout: 0.0

train:
  seq_len: 64
  batch_size: 4
  max_steps: 2
  log_every: 1
  eval_every: 0
  warmup_steps: 1
  save_checkpoint: false

eval:
  final_eval_tokens: 4096
  batch_size: 8
  sample_tokens: 0
